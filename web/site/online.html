<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Online — MU Classic</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0D0B0A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Alegreya+Sans+SC:wght@700&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
<style>
/* The admins' page: who is on the game server now (server.py /api/online). */
.online-page .wrap { max-width: 1120px; }
.tally { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px 32px; }
.tally h3 { margin: 0 0 4px; font: 700 15px/1.2 'Alegreya Sans SC', sans-serif; color: var(--quiet); }
.tally div div { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; box-shadow: inset 0 -1px 0 var(--line); font-size: 15px; }
.tally b { font-weight: 500; color: var(--bone-hi); font-variant-numeric: tabular-nums; }
.count { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px 24px; color: var(--label); }
.count b { color: var(--bone-hi); font-size: 22px; margin-right: 6px; }
.stale { color: var(--danger); text-align: center; }
.who { width: 100%; border-collapse: collapse; font-size: 16px; }
.who th { text-align: left; font: 700 15px/1.2 'Alegreya Sans SC', sans-serif; color: var(--quiet); padding: 8px 10px; box-shadow: inset 0 -1px 0 var(--edge); }
.who td { padding: 10px; box-shadow: inset 0 -1px 0 var(--line); vertical-align: top; }
.who td.num { text-align: right; font-variant-numeric: tabular-nums; }
.who .sub { display: block; font-size: 14px; color: var(--quiet); }
.who .open { background: none; border: 0; padding: 0; font: inherit; color: var(--bone-hi); text-decoration: underline;
  text-decoration-color: rgba(201,162,126,.45); text-underline-offset: 3px; cursor: pointer; text-align: left; }
.who .open:hover { color: #fff; text-decoration-color: currentColor; }
.who .open:focus-visible, .card .x:focus-visible { outline: 2px solid var(--field-focus); outline-offset: 2px; }
/* One character's card: stats, what he wears, what he carries. */
.card { width: min(680px, calc(100vw - 32px)); max-height: calc(100vh - 48px); padding: 0; border-radius: 8px; color: var(--bone);
  border: 1px solid #3A2D24; background: linear-gradient(180deg, #1C1410, #110C0A); box-shadow: 0 30px 80px rgba(0,0,0,.7); }
.card::backdrop { background: rgba(5,3,3,.72); }
.card .in { padding: 24px; display: flex; flex-direction: column; gap: 18px; }
.card header { display: flex; justify-content: space-between; align-items: start; gap: 16px; }
.card h2 { margin: 0; font: 700 26px/1.2 Cinzel, serif; color: var(--bone-hi); letter-spacing: .03em; }
.card .x { background: none; border: 0; color: var(--label); font-size: 28px; line-height: 1; cursor: pointer; padding: 0 4px; }
.card .x:hover { color: var(--bone-hi); }
.card h3 { margin: 0 0 6px; font: 700 15px/1.2 'Alegreya Sans SC', sans-serif; color: var(--quiet); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.stats div { padding: 8px 10px; border-radius: 4px; background: rgba(5,3,3,.5); box-shadow: inset 0 0 0 1px var(--line); }
.stats span { display: block; font-size: 13px; color: var(--quiet); }
.stats b { font-weight: 500; color: var(--bone-hi); font-variant-numeric: tabular-nums; }
.gear div.item { display: flex; gap: 12px; justify-content: space-between; padding: 7px 0; box-shadow: inset 0 -1px 0 var(--line); }
.gear .slot { flex: 0 0 96px; color: var(--quiet); font-size: 14px; }
.gear .what { flex: 1; min-width: 0; }
.gear .what .sub { display: block; font-size: 14px; color: var(--quiet); }
.gear .exc { color: #8FD3A0; }
.gear .rare { color: #E8C978; }
/* At phone width the table becomes one card a player. */
@media (max-width: 680px) {
  .who thead { display: none; }
  .who, .who tbody, .who tr, .who td { display: block; }
  .who tr { padding: 10px 0; box-shadow: inset 0 -1px 0 var(--line); }
  .who td { padding: 2px 0; box-shadow: none; }
  .who td.num { text-align: left; }
  .who td[data-k]::before { content: attr(data-k) ' '; color: var(--quiet); }
}
</style>
</head>
<body>

<div class="bar">
<a href="/"><img src="/logo.svg" alt="MU Classic home" width="435" height="261"></a>
<span style="display: flex; gap: 20px">
<a href="/bugs" style="font-weight: 500">Bug reports</a>
<a href="/account" style="font-weight: 500">Account</a>
</span>
</div>

<main class="account-page online-page">
<div class="wrap">
<h1 class="page-title">Who is online</h1>

<p id="v-none" class="center muted" hidden>This page is for admins. <a href="/account" style="text-decoration: underline">Sign in</a> with an admin account.</p>

<div id="v-list" class="form" style="gap: 20px" hidden>
<div class="count" id="count"></div>
<p id="stale" class="stale" hidden></p>
<table class="who">
<thead><tr><th>Character</th><th>Class</th><th>Level</th><th>Map</th><th>Region</th><th>Platform</th><th>Graphics</th><th>Ping</th><th>Online for</th></tr></thead>
<tbody id="rows"></tbody>
</table>
<p class="center muted" style="font-size: 14px" id="told"></p>

<h2 class="h2" style="margin-top: 24px">All players</h2>
<div class="count" id="all-count"></div>
<table class="who">
<thead><tr><th>Account</th><th>Characters</th><th>Last played</th></tr></thead>
<tbody id="all"></tbody>
</table>

<details style="margin-top: 24px">
<summary class="h2" style="cursor: pointer">Players' machines</summary>
<div class="tally" id="tally" style="margin-top: 12px"></div>
</details>
</div>

</div>
</main>

<dialog id="card" class="card" aria-labelledby="c-name">
<div class="in">
<header><div><h2 id="c-name"></h2><span id="c-sub" class="muted"></span></div><button type="button" class="x" id="c-close" aria-label="Close">×</button></header>
<p id="c-wait" class="muted" hidden></p>
<div id="c-body">
<div><h3>Stats</h3><div class="stats" id="c-stats"></div></div>
<div class="gear" style="margin-top: 18px"><h3>Equipment</h3><div id="c-worn"></div></div>
<div class="gear" style="margin-top: 18px"><h3 id="c-bag-title">Bag</h3><div id="c-bag"></div></div>
</div>
</div>
</dialog>

<footer>
<div class="wrap">
<img src="/logo.svg" alt="MU Classic" width="435" height="261">
</div>
</footer>

<script src="/site.js"></script>
<script>
(() => {
  const { $, el, api, when } = MU;

  const map = (w) => String(w || '').replace(/[_-]+/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase());
  function span(seconds) {
    const m = Math.max(0, Math.floor(seconds / 60));
    return m < 1 ? 'under a minute' : m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + (m % 60) + ' min';
  }
  const since = (seconds) => { const s = Date.now() / 1000 - seconds; return s < 60 ? 'just now' : span(s); };
  function cell(text, sub, key, cls) {
    const td = el('td', cls || '', text);
    if (key) td.dataset.k = key;
    if (sub) td.appendChild(el('span', 'sub', sub));
    return td;
  }

  // The system as the launcher reports it (as the account page reads it): Windows "10.0.<build>",
  // 22000 and later Windows 11; the Mac its bare version.
  function osName(os) {
    if (!os) return '';
    if (/^10\.0\./.test(os)) return parseInt(String(os).split('.')[2] || '0', 10) >= 22000 ? 'Windows 11' : 'Windows 10';
    if (/^\d+(\.\d+)*$/.test(os)) return 'macOS ' + String(os).split('.')[0];
    return String(os);
  }
  const ram = (m) => m && m.ram ? Math.round(m.ram / 1024) + ' GB' : '';
  function tally(o) {
    const accounts = [...new Set(o.players.concat(o.recent, o.everyone).filter((p) => !p.bot && p.account).map((p) => String(p.account)))];
    const box = $('tally');
    box.replaceChildren();
    const groups = [['System', (m) => osName(m.os)], ['Graphics card', (m) => m.gpu], ['Memory', (m) => ram(m)], ['Graphics setting', (m) => m.graphics]];
    for (const [title, of] of groups) {
      const counts = new Map();
      for (const a of accounts) {
        const m = o.machines[a];
        const k = (m && of(m)) || 'not reported';
        counts.set(k, (counts.get(k) || 0) + 1);
      }
      const col = el('div');
      col.appendChild(el('h3', '', title));
      for (const [k, n] of [...counts].sort((x, y) => y[1] - x[1]).slice(0, 8)) {
        const line = el('div');
        line.appendChild(el('span', '', k));
        line.appendChild(el('b', '', String(n)));
        col.appendChild(line);
      }
      if (!accounts.length) col.appendChild(el('div', 'muted', 'No players yet'));
      box.appendChild(col);
    }
  }

  // A character's card (/api/character): asked when its name is clicked, as the server last listed it.
  const fmt = (n) => Number(n || 0).toLocaleString('en-GB');
  function itemLine(it) {
    const row = el('div', 'item');
    row.appendChild(el('span', 'slot', it.where));
    const what = el('div', 'what');
    const name = el('span', it.excellent ? 'exc' : it.plus >= 7 ? 'rare' : '', (it.excellent ? 'Excellent ' : '') + it.name + (it.plus ? ' +' + it.plus : ''));
    what.appendChild(name);
    const bits = [it.skill ? 'skill' : '', it.luck ? 'luck' : '', it.option ? 'option +' + it.option : '',
                  it.sockets ? 'sockets: ' + it.sockets.join(', ') : '', it.bound ? 'bound' : '',
                  it.durability ? 'durability ' + it.durability : ''].filter(Boolean);
    if (bits.length) what.appendChild(el('span', 'sub', bits.join(' · ')));
    for (const line of it.excellent || []) what.appendChild(el('span', 'sub exc', line));
    row.appendChild(what);
    return row;
  }
  async function openCard(account, name) {
    const card = $('card');
    $('c-name').textContent = name;
    $('c-sub').textContent = '';
    $('c-body').hidden = true;
    $('c-wait').hidden = false;
    $('c-wait').textContent = 'Loading…';
    if (!card.open) card.showModal();
    let got;
    try { got = await api('/api/character?account=' + encodeURIComponent(account) + '&name=' + encodeURIComponent(name)); }
    catch (e) { $('c-wait').textContent = 'Can’t reach the website.'; return; }
    const c = got.said;
    if (got.status !== 200) { $('c-wait').textContent = 'The game server has not listed this character yet. It lists them once a minute.'; return; }
    $('c-sub').textContent = c.class + ' · level ' + c.level + ' · ' + map(c.world) + (c.saved ? ' · saved ' + when(c.saved) : '');
    if (c.fresh || !c.points) { $('c-wait').textContent = c.fresh ? 'Made, never played: nothing to show yet.' : 'Its saved data could not be read.'; return; }
    const stats = $('c-stats');
    stats.replaceChildren();
    for (const [k, v] of [['Strength', c.points.strength], ['Agility', c.points.agility], ['Vitality', c.points.vitality],
                          ['Energy', c.points.energy], ['Points to spend', c.points.free], ['Experience', c.experience], ['Zen', c.zen]]) {
      const d = el('div');
      d.appendChild(el('span', '', k));
      d.appendChild(el('b', '', fmt(v)));
      stats.appendChild(d);
    }
    $('c-worn').replaceChildren(...(c.worn.length ? c.worn.map(itemLine) : [el('p', 'muted', 'Nothing worn.')]));
    $('c-bag-title').textContent = 'Bag (' + c.bag.length + ')';
    $('c-bag').replaceChildren(...(c.bag.length ? c.bag.map(itemLine) : [el('p', 'muted', 'Empty.')]));
    $('c-wait').hidden = true;
    $('c-body').hidden = false;
  }
  $('c-close').addEventListener('click', () => $('card').close());
  $('card').addEventListener('click', (e) => { if (e.target === $('card')) $('card').close(); });
  // A character's name, a button that opens its card; plain text for one of no account (a bot).
  function nameCell(account, name, sub) {
    if (!account) return cell(name || '—', sub);
    const td = el('td');
    const b = el('button', 'open', name);
    b.type = 'button';
    b.addEventListener('click', () => openCard(account, name));
    td.appendChild(b);
    if (sub) td.appendChild(el('span', 'sub', sub));
    return td;
  }

  function render(o) {
    const people = o.players.filter((p) => !p.bot), bots = o.players.length - people.length;
    const maps = new Set(o.players.map((p) => p.world)).size;
    const count = $('count');
    count.replaceChildren();
    for (const [n, word] of [[people.length, people.length === 1 ? 'player' : 'players'], [bots, bots === 1 ? 'bot' : 'bots'], [maps, maps === 1 ? 'map' : 'maps']]) {
      const s = el('span');
      s.appendChild(el('b', '', String(n)));
      s.appendChild(document.createTextNode(word));
      count.appendChild(s);
    }
    $('stale').hidden = o.fresh;
    // Each region's server tells its own list (web/server.py online_report): the one gone quiet named.
    const quiet = (o.stale || []).map((name) => {
      const r = (o.regions || []).find((x) => x.name === name);
      return name + ' (since ' + (r ? when(r.at) : '?') + ')';
    });
    $('stale').textContent = quiet.length ? 'Not reporting: ' + quiet.join(', ') + '. It may be down or restarting.'
                                          : 'No game server has reported since the website started.';
    // Players only: the bots are the count above.
    const rows = $('rows');
    rows.replaceChildren();
    if (!people.length) {
      const tr = el('tr');
      const td = cell('Nobody is playing right now.', '', '', 'muted');
      td.colSpan = 9;
      tr.appendChild(td);
      rows.appendChild(tr);
    }
    for (const p of people) {
      const tr = el('tr');
      tr.appendChild(nameCell(p.account, p.name, p.account_name || p.email || ''));
      tr.appendChild(cell(p.class || '—', '', 'Class'));
      tr.appendChild(cell(String(p.level), '', 'Level', 'num'));
      // Blood Castle and Devil Square by their number (mu2_server's World::castle and ::square).
      const which = p.castle > 0 ? 'Blood Castle ' + p.castle : p.square > 0 ? 'Devil Square ' + p.square : '';
      tr.appendChild(cell(which || map(p.world) + (p.copy > 1 ? ' ' + p.copy : ''), '', 'Map'));
      tr.appendChild(cell(p.region || 'North Europe', '', 'Region'));
      // The machine its launcher last reported (web/server.py online_report `machines`): the system
      // with the renderer under it, and the graphics preset the launcher picked for the card.
      const m = o.machines[String(p.account)] || {};
      const system = osName(m.os);
      const drawer = !system ? '' : system.startsWith('macOS') ? 'Metal' : m.renderer === 2 ? 'Direct3D 11' : 'Vulkan';
      tr.appendChild(cell(system || '—', drawer, 'Platform', system ? '' : 'muted'));
      tr.appendChild(cell(m.graphics || '—', '', 'Graphics', m.graphics ? '' : 'muted'));
      // The line's round trip as the server's kernel smooths it (net::Socket::rttMs).
      tr.appendChild(cell(p.ms >= 0 ? p.ms + ' ms' : '—', '', 'Ping', p.ms >= 0 ? 'num' : 'num muted'));
      tr.appendChild(cell(since(p.since), '', 'Online for'));
      rows.appendChild(tr);
    }
    const all = $('all');
    all.replaceChildren();
    const chars = o.everyone.reduce((n, a) => n + a.characters.length, 0);
    const allCount = $('all-count');
    allCount.replaceChildren();
    for (const [n, word] of [[o.everyone.length, o.everyone.length === 1 ? 'account' : 'accounts'], [chars, chars === 1 ? 'character' : 'characters']]) {
      const s = el('span');
      s.appendChild(el('b', '', String(n)));
      s.appendChild(document.createTextNode(word));
      allCount.appendChild(s);
    }
    if (!o.everyone.length) {
      const tr = el('tr');
      const td = cell('The game server has not listed its characters yet; it does once a minute.', '', '', 'muted');
      td.colSpan = 3;
      tr.appendChild(td);
      all.appendChild(tr);
    }
    // One line an account: its characters by name and level, never-played ones left out.
    for (const a of o.everyone) {
      const tr = el('tr');
      tr.appendChild(cell(a.account_name || a.email));
      const td = el('td');
      td.dataset.k = 'Characters';
      const played = a.characters.filter((c) => !c.fresh);
      played.forEach((c, i) => {
        if (i) td.appendChild(document.createTextNode(' · '));
        const b = el('button', 'open', c.name);
        b.type = 'button';
        b.title = c.class + ' · ' + map(c.world);
        b.addEventListener('click', () => openCard(a.account, c.name));
        td.appendChild(b);
        td.appendChild(el('span', 'muted', ' ' + c.level));
      });
      if (!played.length) td.appendChild(el('span', 'muted', 'never played'));
      tr.appendChild(td);
      tr.appendChild(cell(a.last ? when(a.last) : 'never', '', 'Last played'));
      all.appendChild(tr);
    }
    tally(o);
    $('told').textContent = o.at ? 'Updated ' + when(o.at) + ' · refreshes every 10 s' : '';
    $('v-list').hidden = false;
    $('v-none').hidden = true;
  }

  async function load() {
    try {
      const { status, said } = await api('/api/online');
      if (status === 200) return render(said);
      $('v-list').hidden = true;
      $('v-none').hidden = false;
    } catch (e) { /* the next turn tries again */ }
  }
  load();
  setInterval(() => { if (!document.hidden) load(); }, 10000);
})();
</script>
</body>
</html>
