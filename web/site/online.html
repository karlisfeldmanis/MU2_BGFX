<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Online — MU Classic</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0D0B0A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Alegreya+Sans+SC:wght@700&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
<style>
/* The admins' page: who is on the game server now (server.py /api/online). */
.online-page .wrap { max-width: 1120px; }
.tally { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px 32px; }
.tally h3 { margin: 0 0 4px; font: 700 15px/1.2 'Alegreya Sans SC', sans-serif; color: var(--quiet); }
.tally div div { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; box-shadow: inset 0 -1px 0 var(--line); font-size: 15px; }
.tally b { font-weight: 500; color: var(--bone-hi); font-variant-numeric: tabular-nums; }
.count { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px 24px; color: var(--label); }
.count b { color: var(--bone-hi); font-size: 22px; margin-right: 6px; }
.stale { color: var(--danger); text-align: center; }
/* One tile a realm: its people now, its bots under them, dimmed while its server is silent. */
.realms { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.realms div { padding: 12px 14px; border-radius: 6px; background: rgba(5,3,3,.5); box-shadow: inset 0 0 0 1px var(--line); }
.realms h3 { margin: 0; font: 700 15px/1.2 'Alegreya Sans SC', sans-serif; color: var(--bone-hi); }
.realms .city { font-size: 14px; color: var(--quiet); }
.realms b { display: block; margin-top: 6px; font-size: 26px; font-weight: 500; color: var(--bone-hi); font-variant-numeric: tabular-nums; }
.realms .sub { font-size: 14px; color: var(--quiet); }
.realms .down { opacity: .55; }
.realms .down .sub { color: var(--danger); }
.who { width: 100%; border-collapse: collapse; font-size: 16px; }
.who th { text-align: left; font: 700 15px/1.2 'Alegreya Sans SC', sans-serif; color: var(--quiet); padding: 8px 10px; box-shadow: inset 0 -1px 0 var(--edge); }
.who td { padding: 10px; box-shadow: inset 0 -1px 0 var(--line); vertical-align: top; }
.who td.num { text-align: right; font-variant-numeric: tabular-nums; }
.who tr.region td { padding: 18px 10px 6px; font: 700 15px/1.2 'Alegreya Sans SC', sans-serif; color: var(--bone-hi); box-shadow: inset 0 -1px 0 var(--edge); }
.who tr.region .n { margin-left: 10px; font: 400 14px 'Alegreya Sans', sans-serif; color: var(--quiet); }
.who .sub { display: block; font-size: 14px; color: var(--quiet); }
.who .open { background: none; border: 0; padding: 0; font: inherit; color: var(--bone-hi); text-decoration: underline;
  text-decoration-color: rgba(201,162,126,.45); text-underline-offset: 3px; cursor: pointer; text-align: left; }
.who .open:hover { color: #fff; text-decoration-color: currentColor; }
.who .open:focus-visible, .card .x:focus-visible { outline: 2px solid var(--field-focus); outline-offset: 2px; }
/* One character's card: stats, what he wears, what he carries. */
.card { width: min(680px, calc(100vw - 32px)); max-height: calc(100vh - 48px); padding: 0; border-radius: 8px; color: var(--bone);
  border: 1px solid #3A2D24; background: linear-gradient(180deg, #1C1410, #110C0A); box-shadow: 0 30px 80px rgba(0,0,0,.7); }
.card::backdrop { background: rgba(5,3,3,.72); }
.card .in { padding: 24px; display: flex; flex-direction: column; gap: 18px; }
.card header { display: flex; justify-content: space-between; align-items: start; gap: 16px; }
.card h2 { margin: 0; font: 700 26px/1.2 Cinzel, serif; color: var(--bone-hi); letter-spacing: .03em; }
.card .x { background: none; border: 0; color: var(--label); font-size: 28px; line-height: 1; cursor: pointer; padding: 0 4px; }
.card .x:hover { color: var(--bone-hi); }
.card h3 { margin: 0 0 6px; font: 700 15px/1.2 'Alegreya Sans SC', sans-serif; color: var(--quiet); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.stats div { padding: 8px 10px; border-radius: 4px; background: rgba(5,3,3,.5); box-shadow: inset 0 0 0 1px var(--line); }
.stats span { display: block; font-size: 13px; color: var(--quiet); }
.stats b { font-weight: 500; color: var(--bone-hi); font-variant-numeric: tabular-nums; }
.gear div.item { display: flex; gap: 12px; justify-content: space-between; padding: 7px 0; box-shadow: inset 0 -1px 0 var(--line); }
.gear .slot { flex: 0 0 96px; color: var(--quiet); font-size: 14px; }
.gear .what { flex: 1; min-width: 0; }
.gear .what .sub { display: block; font-size: 14px; color: var(--quiet); }
.gear .exc { color: #8FD3A0; }
.gear .rare { color: #E8C978; }
/* The day-by-day graphs (/api/online `days`): new accounts, and players with the peak on at once. */
.graphs { --amber: #C0823A; --blue: #3E8CC4; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 480px), 1fr)); gap: 16px; }
.graph { position: relative; padding: 14px 16px 10px; border-radius: 6px; background: rgba(5,3,3,.5); box-shadow: inset 0 0 0 1px var(--line); min-width: 0; }
.graph h3 { margin: 0; font: 700 15px/1.2 'Alegreya Sans SC', sans-serif; color: var(--quiet); }
.graph .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.graph .big { line-height: 1.3; font-size: 26px; font-weight: 500; color: var(--bone-hi); font-variant-numeric: tabular-nums; }
.graph .big small { font-size: 14px; color: var(--quiet); margin-left: 6px; }
.graph .key { display: flex; gap: 14px; font-size: 14px; color: var(--label); }
.graph .key i { display: inline-block; flex: none; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.graph .key i.stroke { width: 14px; height: 2px; vertical-align: 4px; border-radius: 1px; }
.graph .key span { white-space: nowrap; }
.graph svg { display: block; width: 100%; height: 200px; margin-top: 8px; overflow: visible; }
.graph svg text { font: 12px 'Alegreya Sans', sans-serif; fill: var(--quiet); font-variant-numeric: tabular-nums; }
.graph .tip { position: absolute; pointer-events: none; padding: 6px 10px; border-radius: 4px; font-size: 14px; white-space: nowrap;
  background: #1C1410; box-shadow: 0 0 0 1px #3A2D24, 0 8px 24px rgba(0,0,0,.6); color: var(--bone); z-index: 2; }
.graph .tip b { color: var(--bone-hi); font-weight: 500; }
.ranges { display: flex; justify-content: flex-end; gap: 6px; }
.ranges button { background: none; border: 0; padding: 4px 10px; border-radius: 4px; font: 500 14px 'Alegreya Sans', sans-serif; color: var(--quiet); cursor: pointer; }
.ranges button[aria-pressed="true"] { color: var(--bone-hi); box-shadow: inset 0 0 0 1px var(--field-focus); }
.ranges button:focus-visible { outline: 2px solid var(--field-focus); outline-offset: 2px; }
/* At phone width the table becomes one card a player. */
@media (max-width: 680px) {
  .who thead { display: none; }
  .who, .who tbody, .who tr, .who td { display: block; }
  .who tr { padding: 10px 0; box-shadow: inset 0 -1px 0 var(--line); }
  .who td { padding: 2px 0; box-shadow: none; }
  .who td.num { text-align: left; }
  .who td[data-k]::before { content: attr(data-k) ' '; color: var(--quiet); }
}
</style>
</head>
<body>

<div class="bar">
<a href="/"><img src="/logo.svg" alt="MU Classic home" width="435" height="261"></a>
<span style="display: flex; gap: 20px">
<a href="/bugs" style="font-weight: 500">Bug reports</a>
<a href="/account" style="font-weight: 500">Account</a>
</span>
</div>

<main class="account-page online-page">
<div class="wrap">
<h1 class="page-title">Who is online</h1>

<p id="v-none" class="center muted" hidden>This page is for admins. <a href="/account" style="text-decoration: underline">Sign in</a> with an admin account.</p>

<div id="v-list" class="form" style="gap: 20px" hidden>
<div class="count" id="count"></div>
<div class="realms" id="realms"></div>
<p id="stale" class="stale" hidden></p>
<div class="ranges" id="ranges" role="group" aria-label="Days shown">
<button type="button" data-days="14">14 days</button><button type="button" data-days="30" aria-pressed="true">30 days</button><button type="button" data-days="90">90 days</button><button type="button" data-days="0">All</button>
</div>
<div class="graphs">
<div class="graph" id="g-accounts"><div class="head"><h3>New accounts a day</h3></div><div class="big" id="g-accounts-big"></div><svg aria-hidden="true"></svg></div>
<div class="graph" id="g-players"><div class="head"><h3>Players a day</h3><span class="key"><span><i style="background: var(--amber)"></i>Played that day</span><span><i class="stroke" style="background: var(--blue)"></i>Most on at once</span></span></div><div class="big" id="g-players-big"></div><svg aria-hidden="true"></svg></div>
</div>
<table class="who">
<thead><tr><th>Character</th><th>Class</th><th>Level</th><th>Map</th><th>Platform</th><th>Graphics</th><th>Ping</th><th>Online for</th><th>Played</th></tr></thead>
<tbody id="rows"></tbody>
</table>
<p class="center muted" style="font-size: 14px" id="told"></p>

<details style="margin-top: 24px">
<summary class="h2" style="cursor: pointer">Players' machines</summary>
<div class="tally" id="tally" style="margin-top: 12px"></div>
</details>
</div>

</div>
</main>

<dialog id="card" class="card" aria-labelledby="c-name">
<div class="in">
<header><div><h2 id="c-name"></h2><span id="c-sub" class="muted"></span></div><button type="button" class="x" id="c-close" aria-label="Close">×</button></header>
<p id="c-wait" class="muted" hidden></p>
<div id="c-body">
<div><h3>Stats</h3><div class="stats" id="c-stats"></div></div>
<div class="gear" style="margin-top: 18px"><h3>Equipment</h3><div id="c-worn"></div></div>
<div class="gear" style="margin-top: 18px"><h3 id="c-bag-title">Bag</h3><div id="c-bag"></div></div>
</div>
</div>
</dialog>

<footer>
<div class="wrap">
<img src="/logo.svg" alt="MU Classic" width="435" height="261">
</div>
</footer>

<script src="/site.js"></script>
<script>
(() => {
  const { $, el, api, when } = MU;

  const map = (w) => String(w || '').replace(/[_-]+/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase());
  function span(seconds) {
    const m = Math.max(0, Math.floor(seconds / 60));
    return m < 1 ? 'under a minute' : m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + (m % 60) + ' min';
  }
  const since = (seconds) => { const s = Date.now() / 1000 - seconds; return s < 60 ? 'just now' : span(s); };
  function cell(text, sub, key, cls) {
    const td = el('td', cls || '', text);
    if (key) td.dataset.k = key;
    if (sub) td.appendChild(el('span', 'sub', sub));
    return td;
  }

  // The system as the launcher reports it (as the account page reads it): Windows "10.0.<build>",
  // 22000 and later Windows 11; the Mac its bare version.
  function osName(os) {
    if (!os) return '';
    if (/^10\.0\./.test(os)) return parseInt(String(os).split('.')[2] || '0', 10) >= 22000 ? 'Windows 11' : 'Windows 10';
    if (/^\d+(\.\d+)*$/.test(os)) return 'macOS ' + String(os).split('.')[0];
    return String(os);
  }
  const ram = (m) => m && m.ram ? Math.round(m.ram / 1024) + ' GB' : '';
  function tally(o) {
    const accounts = [...new Set(o.players.concat(o.recent, o.everyone).filter((p) => !p.bot && p.account).map((p) => String(p.account)))];
    const box = $('tally');
    box.replaceChildren();
    const groups = [['System', (m) => osName(m.os)], ['Graphics card', (m) => m.gpu], ['Memory', (m) => ram(m)], ['Graphics setting', (m) => m.graphics]];
    for (const [title, of] of groups) {
      const counts = new Map();
      for (const a of accounts) {
        const m = o.machines[a];
        const k = (m && of(m)) || 'not reported';
        counts.set(k, (counts.get(k) || 0) + 1);
      }
      const col = el('div');
      col.appendChild(el('h3', '', title));
      for (const [k, n] of [...counts].sort((x, y) => y[1] - x[1]).slice(0, 8)) {
        const line = el('div');
        line.appendChild(el('span', '', k));
        line.appendChild(el('b', '', String(n)));
        col.appendChild(line);
      }
      if (!accounts.length) col.appendChild(el('div', 'muted', 'No players yet'));
      box.appendChild(col);
    }
  }

  // A character's card (/api/character): asked when its name is clicked, as the server last listed it.
  const fmt = (n) => Number(n || 0).toLocaleString('en-GB');
  function itemLine(it) {
    const row = el('div', 'item');
    row.appendChild(el('span', 'slot', it.where));
    const what = el('div', 'what');
    const name = el('span', it.excellent ? 'exc' : it.plus >= 7 ? 'rare' : '', (it.excellent ? 'Excellent ' : '') + it.name + (it.plus ? ' +' + it.plus : ''));
    what.appendChild(name);
    const bits = [it.skill ? 'skill' : '', it.luck ? 'luck' : '', it.option ? 'option +' + it.option : '',
                  it.sockets ? 'sockets: ' + it.sockets.join(', ') : '', it.bound ? 'bound' : '',
                  it.durability ? 'durability ' + it.durability : ''].filter(Boolean);
    if (bits.length) what.appendChild(el('span', 'sub', bits.join(' · ')));
    for (const line of it.excellent || []) what.appendChild(el('span', 'sub exc', line));
    row.appendChild(what);
    return row;
  }
  async function openCard(account, name) {
    const card = $('card');
    $('c-name').textContent = name;
    $('c-sub').textContent = '';
    $('c-body').hidden = true;
    $('c-wait').hidden = false;
    $('c-wait').textContent = 'Loading…';
    if (!card.open) card.showModal();
    let got;
    try { got = await api('/api/character?account=' + encodeURIComponent(account) + '&name=' + encodeURIComponent(name)); }
    catch (e) { $('c-wait').textContent = 'Can’t reach the website.'; return; }
    const c = got.said;
    if (got.status !== 200) { $('c-wait').textContent = 'The game server has not listed this character yet. It lists them once a minute.'; return; }
    $('c-sub').textContent = c.class + ' · level ' + c.level + ' · ' + map(c.world) + (c.played ? ' · played ' + span(c.played) : '') + (c.saved ? ' · saved ' + when(c.saved) : '');
    if (c.fresh || !c.points) { $('c-wait').textContent = c.fresh ? 'Made, never played: nothing to show yet.' : 'Its saved data could not be read.'; return; }
    const stats = $('c-stats');
    stats.replaceChildren();
    for (const [k, v] of [['Strength', c.points.strength], ['Agility', c.points.agility], ['Vitality', c.points.vitality],
                          ['Energy', c.points.energy], ['Points to spend', c.points.free], ['Experience', c.experience], ['Zen', c.zen]]) {
      const d = el('div');
      d.appendChild(el('span', '', k));
      d.appendChild(el('b', '', fmt(v)));
      stats.appendChild(d);
    }
    $('c-worn').replaceChildren(...(c.worn.length ? c.worn.map(itemLine) : [el('p', 'muted', 'Nothing worn.')]));
    $('c-bag-title').textContent = 'Bag (' + c.bag.length + ')';
    $('c-bag').replaceChildren(...(c.bag.length ? c.bag.map(itemLine) : [el('p', 'muted', 'Empty.')]));
    $('c-wait').hidden = true;
    $('c-body').hidden = false;
  }
  $('c-close').addEventListener('click', () => $('card').close());
  $('card').addEventListener('click', (e) => { if (e.target === $('card')) $('card').close(); });
  // A character's name, a button that opens its card; plain text for one of no account (a bot).
  function nameCell(account, name, sub) {
    if (!account) return cell(name || '—', sub);
    const td = el('td');
    const b = el('button', 'open', name);
    b.type = 'button';
    b.addEventListener('click', () => openCard(account, name));
    td.appendChild(b);
    if (sub) td.appendChild(el('span', 'sub', sub));
    return td;
  }

  // The graphs: a bar a UTC day, the last `range` days (0 all), redrawn only when the days change.
  const NS = 'http://www.w3.org/2000/svg';
  function svg(tag, attrs) { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); return n; }
  const dayName = (d) => new Date(d + 'T00:00:00Z').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' });
  // Four whole steps up to at least v, each a round number.
  function niceMax(v) {
    const s = v / 4, p = 10 ** Math.floor(Math.log10(Math.max(1, s)));
    for (const m of [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (Number.isInteger(m * p) && m * p >= s) return 4 * m * p;
    return 4 * Math.ceil(s);
  }
  let days = [], daysKey = '', range = 30;
  try { const r = localStorage.getItem('online-range'); if (r !== null) range = parseInt(r, 10) || 0; } catch (e) { /* default */ }
  // bars: [{key, color}], line: {key, color} or null; tip(row) -> [label, value] pairs.
  function graph(box, rows, bars, line, tip) {
    const root = $(box), area = root.querySelector('svg');
    const W = Math.max(280, area.clientWidth || root.clientWidth - 32), H = 200, L = 34, B = 22, T = 6;
    const max = niceMax(Math.max(1, ...rows.flatMap((r) => bars.map((b) => r[b.key]).concat(line ? [r[line.key]] : []))));
    const n = rows.length, step = (W - L) / Math.max(1, n), bw = Math.max(1, Math.min(28, step - 2));
    const y = (v) => T + (H - T - B) * (1 - v / max);
    area.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    area.replaceChildren();
    for (let i = 0; i <= 4; i++) {
      const v = max * i / 4, yy = y(v);
      area.appendChild(svg('line', { x1: L, x2: W, y1: yy, y2: yy, stroke: i ? 'rgba(201,191,174,.08)' : 'rgba(201,191,174,.25)', 'stroke-width': 1 }));
      const t = svg('text', { x: L - 6, y: yy + 4, 'text-anchor': 'end' });
      t.textContent = fmt(v);
      area.appendChild(t);
    }
    // A date label every so many days, so they never touch.
    const every = Math.max(1, Math.ceil(56 / step));
    rows.forEach((r, i) => {
      const cx = L + step * (i + .5);
      for (const b of bars) {
        const v = r[b.key];
        if (!v) continue;
        const top = y(v), h = H - B - top, rr = Math.min(4, bw / 2, h);
        area.appendChild(svg('path', { fill: b.color, d: 'M' + (cx - bw / 2) + ',' + (H - B) + 'V' + (top + rr) + 'q0,-' + rr + ' ' + rr + ',-' + rr +
          'H' + (cx + bw / 2 - rr) + 'q' + rr + ',0 ' + rr + ',' + rr + 'V' + (H - B) + 'Z' }));
      }
      if ((n - 1 - i) % every === 0) {
        const t = svg('text', { x: cx, y: H - 5, 'text-anchor': 'middle' });
        t.textContent = dayName(r.day);
        area.appendChild(t);
      }
    });
    if (line) {
      const pts = rows.map((r, i) => (L + step * (i + .5)) + ',' + y(r[line.key]));
      area.appendChild(svg('polyline', { points: pts.join(' '), fill: 'none', stroke: line.color, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
      if (n <= 45) rows.forEach((r, i) => area.appendChild(svg('circle', { cx: L + step * (i + .5), cy: y(r[line.key]), r: 3, fill: line.color, stroke: '#0D0B0A', 'stroke-width': 2 })));
    }
    // Hover: a column the width of its day, a guide and a tip.
    const guide = svg('line', { y1: T, y2: H - B, stroke: 'rgba(243,232,212,.35)', 'stroke-width': 1, visibility: 'hidden' });
    area.appendChild(guide);
    let tipBox = root.querySelector('.tip');
    if (!tipBox) { tipBox = el('div', 'tip'); tipBox.hidden = true; root.appendChild(tipBox); }
    const hit = svg('rect', { x: L, y: 0, width: W - L, height: H, fill: 'transparent' });
    area.appendChild(hit);
    const show = (e) => {
      const box = area.getBoundingClientRect(), x = (e.clientX - box.left) * W / box.width;
      const i = Math.min(n - 1, Math.max(0, Math.floor((x - L) / step)));
      const r = rows[i], cx = L + step * (i + .5);
      guide.setAttribute('x1', cx); guide.setAttribute('x2', cx); guide.setAttribute('visibility', 'visible');
      tipBox.replaceChildren(el('div', '', new Date(r.day + 'T00:00:00Z').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' })));
      for (const [k, v] of tip(r)) { const d = el('div', '', k + ' '); d.appendChild(el('b', '', v)); tipBox.appendChild(d); }
      tipBox.hidden = false;
      const at = root.getBoundingClientRect(), px = cx * box.width / W + box.left - at.left, w = tipBox.offsetWidth;
      // Beside the day's column, on the side with room, at the plot's top.
      tipBox.style.left = (px + 12 + w < at.width ? px + 12 : Math.max(4, px - 12 - w)) + 'px';
      tipBox.style.top = (box.top - at.top) + 'px';
    };
    hit.addEventListener('pointermove', show);
    hit.addEventListener('pointerdown', show);
    hit.addEventListener('pointerleave', () => { guide.setAttribute('visibility', 'hidden'); tipBox.hidden = true; });
  }
  function big(id, n, sub) { const b = $(id); b.replaceChildren(document.createTextNode(fmt(n))); b.appendChild(el('small', '', sub)); }
  function drawGraphs() {
    if (!days.length) return;
    const rows = range ? days.slice(-range) : days;
    const today = days[days.length - 1];
    const sum = (k) => rows.reduce((n, r) => n + r[k], 0);
    big('g-accounts-big', today.accounts, 'accounts · ' + fmt(sum('registered')) + ' new in these ' + rows.length + ' days · ' + fmt(today.registered) + ' today');
    big('g-players-big', today.players, 'played today · most on at once ' + fmt(Math.max(...rows.map((r) => r.peak))) + ' in these days');
    const amber = 'var(--amber)', blue = 'var(--blue)';
    graph('g-accounts', rows, [{ key: 'registered', color: amber }], null,
          (r) => [['New accounts', fmt(r.registered)], ['All accounts', fmt(r.accounts)]]);
    graph('g-players', rows, [{ key: 'players', color: amber }], { key: 'peak', color: blue },
          (r) => [['Played', fmt(r.players)], ['Most on at once', fmt(r.peak) + (r.peak_at ? ' at ' + new Date(r.peak_at * 1000).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: 'UTC' }) + ' UTC' : '')]]);
  }
  for (const b of $('ranges').querySelectorAll('button')) {
    b.setAttribute('aria-pressed', String(parseInt(b.dataset.days, 10) === range));
    b.addEventListener('click', () => {
      range = parseInt(b.dataset.days, 10);
      try { localStorage.setItem('online-range', String(range)); } catch (e) { /* kept for this visit */ }
      for (const o of $('ranges').querySelectorAll('button')) o.setAttribute('aria-pressed', String(o === b));
      drawGraphs();
    });
  }
  let resizing;
  window.addEventListener('resize', () => { clearTimeout(resizing); resizing = setTimeout(drawGraphs, 150); });

  function render(o) {
    const people = o.players.filter((p) => !p.bot), bots = o.players.length - people.length;
    const maps = new Set(o.players.map((p) => p.world)).size;
    const count = $('count');
    count.replaceChildren();
    for (const [n, word] of [[people.length, people.length === 1 ? 'player' : 'players'], [bots, bots === 1 ? 'bot' : 'bots'], [maps, maps === 1 ? 'map' : 'maps']]) {
      const s = el('span');
      s.appendChild(el('b', '', String(n)));
      s.appendChild(document.createTextNode(word));
      count.appendChild(s);
    }
    // Each realm's people now (web/server.py online_report `regions`, every one of REGIONS).
    $('realms').replaceChildren(...(o.regions || []).map((r) => {
      const d = el('div', r.up ? '' : 'down');
      d.appendChild(el('h3', '', r.name));
      d.appendChild(el('span', 'city', r.city));
      d.appendChild(el('b', '', String(r.players)));
      d.appendChild(el('span', 'sub', r.up ? (r.players === 1 ? 'player' : 'players') + (r.bots ? ' · ' + r.bots + (r.bots === 1 ? ' bot' : ' bots') : '')
                                          : r.at ? 'not reporting since ' + when(r.at) : 'not reporting'));
      return d;
    }));
    $('stale').hidden = o.fresh;
    // Each region's server tells its own list (web/server.py online_report): the one gone quiet named.
    const quiet = (o.stale || []).map((name) => {
      const r = (o.regions || []).find((x) => x.name === name);
      return name + ' (since ' + (r ? when(r.at) : '?') + ')';
    });
    $('stale').textContent = quiet.length ? 'Not reporting: ' + quiet.join(', ') + '. It may be down or restarting.'
                                          : 'No game server has reported since the website started.';
    // Players only: the bots are the count above.
    const rows = $('rows');
    rows.replaceChildren();
    if (!people.length) {
      const tr = el('tr');
      const td = cell('Nobody is playing right now.', '', '', 'muted');
      td.colSpan = 9;
      tr.appendChild(td);
      rows.appendChild(tr);
    }
    // A heading row a region, in REGIONS' order (the realm tiles'), its people under it.
    const order = (o.regions || []).map((r) => r.name);
    const at = (p) => { const i = order.indexOf(p.region || 'North Europe'); return i < 0 ? order.length : i; };
    let region = null;
    for (const p of people.slice().sort((a, b) => at(a) - at(b))) {
      if ((p.region || 'North Europe') !== region) {
        region = p.region || 'North Europe';
        const n = people.filter((q) => (q.region || 'North Europe') === region).length;
        const head = el('tr', 'region');
        const td = el('td', '', region);
        td.colSpan = 9;
        td.appendChild(el('span', 'n', n + (n === 1 ? ' player' : ' players')));
        head.appendChild(td);
        rows.appendChild(head);
      }
      const tr = el('tr');
      tr.appendChild(nameCell(p.account, p.name, p.account_name || p.email || ''));
      tr.appendChild(cell(p.class || '—', '', 'Class'));
      tr.appendChild(cell(String(p.level), '', 'Level', 'num'));
      // Blood Castle and Devil Square by their number (mu2_server's World::castle and ::square).
      const which = p.castle > 0 ? 'Blood Castle ' + p.castle : p.square > 0 ? 'Devil Square ' + p.square : '';
      tr.appendChild(cell(which || map(p.world) + (p.copy > 1 ? ' ' + p.copy : ''), '', 'Map'));
      // The machine its launcher last reported (web/server.py online_report `machines`): the system
      // with the renderer under it, and the graphics preset the launcher picked for the card.
      const m = o.machines[String(p.account)] || {};
      const system = osName(m.os);
      const drawer = !system ? '' : system.startsWith('macOS') ? 'Metal' : m.renderer === 2 ? 'Direct3D 11' : 'Vulkan';
      tr.appendChild(cell(system || '—', drawer, 'Platform', system ? '' : 'muted'));
      tr.appendChild(cell(m.graphics || '—', '', 'Graphics', m.graphics ? '' : 'muted'));
      // The line's round trip as the server's kernel smooths it (net::Socket::rttMs).
      tr.appendChild(cell(p.ms >= 0 ? p.ms + ' ms' : '—', '', 'Ping', p.ms >= 0 ? 'num' : 'num muted'));
      tr.appendChild(cell(since(p.since), '', 'Online for'));
      // Every play of his the website has seen (web/server.py Store.played).
      tr.appendChild(cell(span(p.played), '', 'Played'));
      rows.appendChild(tr);
    }
    tally(o);
    $('v-list').hidden = false;
    const key = JSON.stringify(o.days || []);
    if (key !== daysKey) { daysKey = key; days = o.days || []; drawGraphs(); }
    $('told').textContent = o.at ? 'Updated ' + when(o.at) + ' · refreshes every 10 s' : '';
    $('v-list').hidden = false;
    $('v-none').hidden = true;
  }

  async function load() {
    try {
      const { status, said } = await api('/api/online');
      if (status === 200) return render(said);
      $('v-list').hidden = true;
      $('v-none').hidden = false;
    } catch (e) { /* the next turn tries again */ }
  }
  load();
  setInterval(() => { if (!document.hidden) load(); }, 10000);
})();
</script>
</body>
</html>
