<div class="gcard">
<div class="ghead" style="background: {{r.gc.headBg}}"><span class="gline" style="background: {{r.gc.lineBg}}"></span>
<div class="gtitle" style="color: {{r.gc.tone}}">{{r.gc.title}}</div>
<sc-if value="{{r.gc.sub}}" hint-placeholder-val="{{ true }}"><div class="gsub" style="color: {{r.gc.tone}}">{{r.gc.sub}}</div></sc-if>
<sc-if value="{{r.gc.bound}}" hint-placeholder-val="{{ false }}"><div class="gbound">{{r.gc.bound}}</div></sc-if>
</div>
<div class="gbody">
<sc-for list="{{r.gc.rows}}" as="gr" hint-placeholder-count="6">
<sc-if value="{{gr.isHead}}" hint-placeholder-val="{{ false }}"><div class="ghl"><b style="color: {{gr.color}}">{{gr.text}}</b><span>{{gr.word}}</span></div></sc-if>
<sc-if value="{{gr.isBreak}}" hint-placeholder-val="{{ false }}"><div class="gbr"><sc-for list="{{gr.items}}" as="gb" hint-placeholder-count="3"><div><b style="color: {{gb.color}}">{{gb.figure}}</b>{{gb.text}}</div></sc-for></div></sc-if>
<sc-if value="{{gr.isRule}}" hint-placeholder-val="{{ false }}"><div class="grule"></div></sc-if>
<sc-if value="{{gr.isOpt}}" hint-placeholder-val="{{ true }}"><div class="gopt" style="margin-top: {{gr.gap}}"><span class="gmark" aria-hidden="true"><sc-if value="{{gr.mDia}}" hint-placeholder-val="{{ false }}"><svg width="16" height="21" viewBox="-8 -10.5 16 21"><rect x="-2.48" y="-2.48" width="4.96" height="4.96" fill="{{gr.mColor}}"></rect></svg></sc-if><sc-if value="{{gr.mStar}}" hint-placeholder-val="{{ false }}"><svg width="16" height="21" viewBox="-8 -10.5 16 21"><polygon points="0,-4 1.28,-1.28 4,0 1.28,1.28 0,4 -1.28,1.28 -4,0 -1.28,-1.28" fill="{{gr.mColor}}"></polygon></svg></sc-if><sc-if value="{{gr.mSocket}}" hint-placeholder-val="{{ false }}"><svg width="16" height="21" viewBox="-8 -10.5 16 21"><rect x="-2.5" y="-2.5" width="5" height="5" fill="none" stroke="{{gr.mColor}}" stroke-width="1"></rect></svg></sc-if><sc-if value="{{gr.mRing}}" hint-placeholder-val="{{ false }}"><svg width="18" height="21" viewBox="-9 -10.5 18 21"><polygon points="0,-9 7.2,0 0,9 -7.2,0" fill="rgba(0,0,0,.7)"></polygon><polygon points="0,-7.92 6.34,0 0,7.92 -6.34,0" fill="#9e733d"></polygon><polygon points="0,-5.4 4.32,0 0,5.4 -4.32,0" fill="#0d0908"></polygon></svg></sc-if><sc-if value="{{gr.mSet}}" hint-placeholder-val="{{ false }}"><svg width="18" height="21" viewBox="-9 -10.5 18 21"><polygon points="0,-9 7.2,0 0,9 -7.2,0" fill="rgba(0,0,0,.7)"></polygon><polygon points="0,-7.92 6.34,0 0,7.92 -6.34,0" fill="#9e733d"></polygon><polygon points="0,-5.4 4.32,0 0,5.4 -4.32,0" fill="#0d0908"></polygon><polygon points="0,-5.58 4.46,0 0,5.58 -4.46,0" fill="#8c80ff"></polygon><polygon points="0,-3.6 2.88,0 0,3.6 -2.88,0" fill="#ff63b3"></polygon></svg></sc-if></span><sc-if value="{{gr.keyword}}" hint-placeholder-val="{{ false }}"><span style="color: {{gr.kwColor}}">{{gr.keyword}}</span> · </sc-if><span style="color: {{gr.color}}">{{gr.text}}</span> <b style="color: {{gr.tailColor}}">{{gr.tail}}</b></div></sc-if>
<sc-if value="{{gr.isStat}}" hint-placeholder-val="{{ false }}"><div class="gstat" style="margin-top: {{gr.gap}}"><span style="color: {{gr.labelColor}}">{{gr.label}}</span><b style="color: {{gr.tailColor}}">{{gr.tail}}</b></div></sc-if>
</sc-for>
</div>
<sc-if value="{{r.gc.hasFoot}}" hint-placeholder-val="{{ true }}"><div class="gfoot"><div><sc-for list="{{r.gc.footL}}" as="fl" hint-placeholder-count="2"><div style="color: {{fl.color}}">{{fl.text}}</div></sc-for></div><div><sc-for list="{{r.gc.footR}}" as="fr" hint-placeholder-count="1"><div class="r"><sc-if value="{{fr.ring}}" hint-placeholder-val="{{ true }}"><svg width="19" height="19" viewBox="-9.5 -9.5 19 19" aria-hidden="true"><circle r="8" fill="none" stroke="rgba(255,255,255,.113)" stroke-width="3"></circle><circle r="8" fill="none" stroke="#e6dbc2" stroke-width="3" stroke-dasharray="{{fr.dash}}" transform="rotate(-90)"></circle></svg></sc-if>{{fr.text}}</div></sc-for></div></div></sc-if>
<sc-if value="{{r.gc.sell}}" hint-placeholder-val="{{ true }}"><div class="gsell"><span>SELLS FOR</span><b><svg width="15" height="15" viewBox="-7.5 -7.5 15 15" aria-hidden="true"><circle r="6.5" fill="#d9a52b" stroke="#7a5512" stroke-width="1"></circle><circle r="3.6" fill="none" stroke="#f5d27a" stroke-width="1"></circle></svg>{{r.gc.sell}}</b></div></sc-if>
</div>
